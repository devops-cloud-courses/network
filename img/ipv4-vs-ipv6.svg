<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="ipBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ipIndigoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="ipShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="16" fill="#f8fafc"/>

  <!-- Left Card: IPv4 -->
  <g filter="url(#ipShadow)">
    <rect x="28" y="24" width="436" height="392" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="28" y="24" width="436" height="54" rx="18" fill="url(#ipBlueGrad)"/>
    <text x="246" y="57" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">IPv4 — 32-bit Addressing</text>

    <!-- Address Format Pill -->
    <rect x="52" y="98" width="388" height="64" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="246" y="121" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">4 Octets (Dotted Decimal — 8 bits each)</text>
    <text x="246" y="147" text-anchor="middle" font-size="19" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1d4ed8">192 . 168 . 100 . 25</text>

    <!-- Specs -->
    <rect x="52" y="180" width="186" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="145" y="205" text-anchor="middle" font-size="11.5" font-weight="700" fill="#64748b">ADDRESS SPACE</text>
    <text x="145" y="232" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#0f172a">~4.3 Billion</text>
    <text x="145" y="246" text-anchor="middle" font-size="10.5" fill="#64748b">(2³² addresses)</text>

    <rect x="254" y="180" width="186" height="72" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="347" y="205" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">STATUS</text>
    <text x="347" y="230" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">Exhausted</text>
    <text x="347" y="246" text-anchor="middle" font-size="10.5" fill="#b91c1c">Requires NAT &amp; RFC 1918</text>

    <!-- Key Traits -->
    <rect x="52" y="268" width="388" height="124" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="72" y="294" font-size="13" font-weight="700" fill="#0f172a">• Variable Header: <tspan font-weight="500" fill="#475569">20–60 bytes + checksum per hop</tspan></text>
    <text x="72" y="320" font-size="13" font-weight="700" fill="#0f172a">• Broadcast Traffic: <tspan font-weight="500" fill="#475569">Uses ARP broadcast on L2 LAN</tspan></text>
    <text x="72" y="346" font-size="13" font-weight="700" fill="#0f172a">• Configuration: <tspan font-weight="500" fill="#475569">Manual (Static) or DHCP server</tspan></text>
    <text x="72" y="372" font-size="13" font-weight="700" fill="#0f172a">• DNS Record: <tspan font-family="'JetBrains Mono', monospace" fill="#2563eb">A</tspan> <tspan font-weight="500" fill="#475569">record maps hostname → IPv4</tspan></text>
  </g>

  <!-- Right Card: IPv6 -->
  <g filter="url(#ipShadow)">
    <rect x="496" y="24" width="436" height="392" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="496" y="24" width="436" height="54" rx="18" fill="url(#ipIndigoGrad)"/>
    <text x="714" y="57" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">IPv6 — 128-bit Addressing</text>

    <!-- Address Format Pill -->
    <rect x="520" y="98" width="388" height="64" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="714" y="121" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3730a3">8 Hextets (Hexadecimal — 16 bits each, :: zero-compression)</text>
    <text x="714" y="147" text-anchor="middle" font-size="15.5" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#4f46e5">2001:0db8:85a3::8a2e:0370:7334</text>

    <!-- Specs -->
    <rect x="520" y="180" width="186" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="613" y="205" text-anchor="middle" font-size="11.5" font-weight="700" fill="#64748b">ADDRESS SPACE</text>
    <text x="613" y="232" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#0f172a">3.4 × 10³⁸</text>
    <text x="613" y="246" text-anchor="middle" font-size="10.5" fill="#64748b">(2¹²⁸ addresses)</text>

    <rect x="722" y="180" width="186" height="72" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="815" y="205" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">END-TO-END</text>
    <text x="815" y="230" text-anchor="middle" font-size="15" font-weight="800" fill="#059669">No NAT Needed</text>
    <text x="815" y="246" text-anchor="middle" font-size="10.5" fill="#047857">Global /64 per subnet</text>

    <!-- Key Traits -->
    <rect x="520" y="268" width="388" height="124" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="540" y="294" font-size="13" font-weight="700" fill="#0f172a">• Fixed Header: <tspan font-weight="500" fill="#475569">Streamlined 40-byte header for fast routing</tspan></text>
    <text x="540" y="320" font-size="13" font-weight="700" fill="#0f172a">• No Broadcast: <tspan font-weight="500" fill="#475569">Uses Multicast &amp; Neighbor Discovery (NDP)</tspan></text>
    <text x="540" y="346" font-size="13" font-weight="700" fill="#0f172a">• Auto-Config: <tspan font-weight="500" fill="#475569">Stateless Address Auto-Config (SLAAC)</tspan></text>
    <text x="540" y="372" font-size="13" font-weight="700" fill="#0f172a">• DNS Record: <tspan font-family="'JetBrains Mono', monospace" fill="#4f46e5">AAAA</tspan> <tspan font-weight="500" fill="#475569">record maps hostname → IPv6</tspan></text>
  </g>
</svg>
