<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="l4Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="l7Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="l4Arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="l7Arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <filter id="lb47Shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="16" fill="#f8fafc"/>

  <!-- Left Panel: Layer 4 Load Balancer -->
  <g filter="url(#lb47Shadow)">
    <rect x="24" y="22" width="444" height="396" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="24" y="22" width="444" height="52" rx="18" fill="url(#l4Grad)"/>
    <text x="246" y="55" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">Layer 4 Load Balancer (Transport — TCP / UDP)</text>

    <!-- Incoming Packet -->
    <rect x="46" y="96" width="398" height="48" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="245" y="125" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">Inspects ONLY: Src IP + Port → Dst VIP:443 (TCP/UDP)</text>

    <!-- L4 LB Box -->
    <rect x="46" y="182" width="166" height="106" rx="14" fill="url(#l4Grad)"/>
    <text x="129" y="224" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">L4 Network LB</text>
    <text x="129" y="246" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#dbeafe">Packet / Flow Hash</text>
    <text x="129" y="266" text-anchor="middle" font-size="10.5" fill="#bfdbfe">No HTTP Inspection</text>

    <!-- Target Pool -->
    <rect x="274" y="166" width="170" height="60" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="2"/>
    <text x="359" y="194" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Backend Node 1</text>
    <text x="359" y="213" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#2563eb">10.0.1.11:443</text>

    <rect x="274" y="244" width="170" height="60" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="2"/>
    <text x="359" y="272" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Backend Node 2</text>
    <text x="359" y="291" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#2563eb">10.0.1.12:443</text>

    <line x1="212" y1="220" x2="266" y2="198" stroke="#2563eb" stroke-width="2.5" marker-end="url(#l4Arrow)"/>
    <line x1="212" y1="250" x2="266" y2="272" stroke="#2563eb" stroke-width="2.5" marker-end="url(#l4Arrow)"/>

    <!-- L4 Pros -->
    <rect x="46" y="324" width="398" height="74" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="64" y="349" font-size="12.5" font-weight="700" fill="#0f172a">• Ultra-low latency &amp; millions of connections/sec</text>
    <text x="64" y="370" font-size="12.5" font-weight="700" fill="#0f172a">• Supports any TCP/UDP protocol <tspan font-weight="500" fill="#64748b">(Databases, DNS, Gaming)</tspan></text>
    <text x="64" y="389" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#2563eb">Examples: AWS NLB, GCP Passthrough NLB, IPVS, MetalLB</text>
  </g>

  <!-- Right Panel: Layer 7 Load Balancer -->
  <g filter="url(#lb47Shadow)">
    <rect x="492" y="22" width="444" height="396" rx="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="492" y="22" width="444" height="52" rx="18" fill="url(#l7Grad)"/>
    <text x="714" y="55" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">Layer 7 Load Balancer (Application — HTTP/S, gRPC)</text>

    <!-- Incoming Request -->
    <rect x="514" y="96" width="398" height="48" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="713" y="125" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#047857">Inspects: Host Header, URL Path (/api, /pay), Cookies, JWT</text>

    <!-- L7 LB Box -->
    <rect x="514" y="182" width="166" height="106" rx="14" fill="url(#l7Grad)"/>
    <text x="597" y="224" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">L7 App LB</text>
    <text x="597" y="246" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#d1fae5">Terminates TLS</text>
    <text x="597" y="266" text-anchor="middle" font-size="10.5" fill="#a7f3d0">Content-Based Routing</text>

    <!-- Microservice Pools -->
    <rect x="742" y="166" width="170" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="827" y="192" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Auth Service</text>
    <text x="827" y="213" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#059669">Path: /auth/*</text>

    <rect x="742" y="244" width="170" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="827" y="270" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Payment Service</text>
    <text x="827" y="291" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#059669">Path: /pay/*</text>

    <line x1="680" y1="220" x2="734" y2="198" stroke="#059669" stroke-width="2.5" marker-end="url(#l7Arrow)"/>
    <line x1="680" y1="250" x2="734" y2="272" stroke="#059669" stroke-width="2.5" marker-end="url(#l7Arrow)"/>

    <!-- L7 Pros -->
    <rect x="514" y="324" width="398" height="74" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="532" y="349" font-size="12.5" font-weight="700" fill="#0f172a">• Smart routing (Host/Path/Header), Canary splits, WAF</text>
    <text x="532" y="370" font-size="12.5" font-weight="700" fill="#0f172a">• Offloads TLS handshakes &amp; HTTP/2–HTTP/3 multiplexing</text>
    <text x="532" y="389" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#059669">Examples: AWS ALB, GCP Cloud App LB, Envoy, NGINX, Traefik</text>
  </g>
</svg>
