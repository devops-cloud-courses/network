<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="tlsBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mtlsGreenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="tlsArrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="tlsArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <filter id="tlsShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="16" fill="#f8fafc"/>

  <!-- Left Panel: Standard One-Way TLS (HTTPS) -->
  <g filter="url(#tlsShadow)">
    <rect x="24" y="22" width="444" height="396" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="24" y="22" width="444" height="52" rx="18" fill="url(#tlsBlueGrad)"/>
    <text x="246" y="55" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">Standard TLS (One-Way — Public Web HTTPS)</text>

    <!-- Client -->
    <rect x="46" y="108" width="124" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="108" y="145" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Browser</text>
    <text x="108" y="166" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#475569">Anonymous</text>
    <text x="108" y="182" text-anchor="middle" font-size="10.5" fill="#64748b">(No Client Cert)</text>

    <!-- Server -->
    <rect x="322" y="108" width="124" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="384" y="145" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Web Server</text>
    <text x="384" y="166" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#2563eb">Server Cert</text>
    <text x="384" y="182" text-anchor="middle" font-size="10.5" fill="#64748b">Signed by Public CA</text>

    <!-- Step 1: Server presents cert -->
    <line x1="316" y1="138" x2="178" y2="138" stroke="#2563eb" stroke-width="2.5" marker-end="url(#tlsArrowBlue)"/>
    <text x="246" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">1. Server Cert + Public Key</text>

    <!-- Step 2: Client verifies -->
    <rect x="64" y="224" width="364" height="58" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="246" y="248" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">2. Client verifies Server Identity against trusted CA</text>
    <text x="246" y="268" text-anchor="middle" font-size="11.5" fill="#475569">Server does NOT verify client via TLS certificate</text>

    <!-- Step 3: Encrypted Tunnel -->
    <rect x="64" y="302" width="364" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="246" y="330" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">3. Symmetric Encrypted Session (AES-GCM)</text>
    <text x="246" y="354" text-anchor="middle" font-size="12" fill="#475569">Used for: <tspan font-weight="700" fill="#2563eb">Browsers → Public Websites / APIs</tspan></text>
    <text x="246" y="374" text-anchor="middle" font-size="11.5" fill="#64748b">(Client auth handled at L7 via JWT / OAuth / Cookies)</text>
  </g>

  <!-- Right Panel: Mutual TLS (mTLS) -->
  <g filter="url(#tlsShadow)">
    <rect x="492" y="22" width="444" height="396" rx="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="492" y="22" width="444" height="52" rx="18" fill="url(#mtlsGreenGrad)"/>
    <text x="714" y="55" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">Mutual TLS (mTLS — Zero Trust Microservices)</text>

    <!-- Service A (Client) -->
    <rect x="514" y="108" width="124" height="90" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="576" y="145" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Service A</text>
    <text x="576" y="166" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#059669">Client Cert</text>
    <text x="576" y="182" text-anchor="middle" font-size="10.5" fill="#047857">SPIFFE / Internal CA</text>

    <!-- Service B (Server) -->
    <rect x="790" y="108" width="124" height="90" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="852" y="145" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Service B</text>
    <text x="852" y="166" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#059669">Server Cert</text>
    <text x="852" y="182" text-anchor="middle" font-size="10.5" fill="#047857">SPIFFE / Internal CA</text>

    <!-- Mutual Cert Exchange -->
    <line x1="784" y1="134" x2="646" y2="134" stroke="#059669" stroke-width="2.5" marker-end="url(#tlsArrowGreen)"/>
    <text x="714" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">1. Server Cert</text>

    <line x1="646" y1="172" x2="784" y2="172" stroke="#059669" stroke-width="2.5" marker-end="url(#tlsArrowGreen)"/>
    <text x="714" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">2. Client Cert</text>

    <!-- Mutual Verification -->
    <rect x="532" y="224" width="364" height="58" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="714" y="248" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">3. Both sides cryptographically verify each other</text>
    <text x="714" y="268" text-anchor="middle" font-size="11.5" fill="#047857">Strong workload identity + encryption in one handshake</text>

    <!-- Summary -->
    <rect x="532" y="302" width="364" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="714" y="330" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">4. Authenticated &amp; Encrypted Zero-Trust Link</text>
    <text x="714" y="354" text-anchor="middle" font-size="12" fill="#475569">Used for: <tspan font-weight="700" fill="#059669">Service Mesh (Istio / Cilium), B2B APIs, IoT</tspan></text>
    <text x="714" y="374" text-anchor="middle" font-size="11.5" fill="#64748b">(Prevents lateral movement &amp; spoofing inside cluster)</text>
  </g>
</svg>
