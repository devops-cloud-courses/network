<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="fpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="rpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="pxArrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="pxArrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <filter id="pxShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="16" fill="#f8fafc"/>

  <!-- Top Row: Forward Proxy (Protects Clients) -->
  <g filter="url(#pxShadow)">
    <rect x="24" y="20" width="912" height="190" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="42" y="34" width="240" height="28" rx="8" fill="#eff6ff"/>
    <text x="162" y="53" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">FORWARD PROXY (Client-Side)</text>

    <!-- Private LAN Boundary around Clients + Forward Proxy -->
    <rect x="42" y="72" width="490" height="122" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="287" y="92" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">Internal Corporate / VPC Network (Protects &amp; Filters Clients)</text>

    <!-- Clients -->
    <rect x="60" y="104" width="136" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="128" y="135" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">Internal Clients</text>
    <text x="128" y="156" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#64748b">Workstations / VMs</text>

    <!-- Forward Proxy -->
    <rect x="276" y="102" width="234" height="78" rx="12" fill="url(#fpGrad)"/>
    <text x="393" y="134" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Forward Proxy</text>
    <text x="393" y="154" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#dbeafe">SWG / Envoy / Corporate Egress</text>
    <text x="393" y="170" text-anchor="middle" font-size="10.5" fill="#bfdbfe">Egress Policy • DLP • Anonymity</text>

    <!-- Internet -->
    <rect x="596" y="106" width="118" height="70" rx="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="655" y="146" text-anchor="middle" font-size="13.5" font-weight="800" fill="#334155">Internet</text>

    <!-- External Server -->
    <rect x="774" y="104" width="142" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="845" y="135" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">Public Servers</text>
    <text x="845" y="156" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#64748b">github.com / APIs</text>

    <line x1="196" y1="141" x2="268" y2="141" stroke="#2563eb" stroke-width="2.5" marker-end="url(#pxArrowBlue)"/>
    <line x1="510" y1="141" x2="588" y2="141" stroke="#2563eb" stroke-width="2.5" marker-end="url(#pxArrowBlue)"/>
    <line x1="714" y1="141" x2="766" y2="141" stroke="#2563eb" stroke-width="2.5" marker-end="url(#pxArrowBlue)"/>
  </g>

  <!-- Bottom Row: Reverse Proxy (Protects Servers) -->
  <g filter="url(#pxShadow)">
    <rect x="24" y="230" width="912" height="190" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="42" y="244" width="246" height="28" rx="8" fill="#eef2ff"/>
    <text x="165" y="263" text-anchor="middle" font-size="13" font-weight="800" fill="#4338ca">REVERSE PROXY (Server-Side)</text>

    <!-- External Clients -->
    <rect x="60" y="314" width="136" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="128" y="345" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">Public Users</text>
    <text x="128" y="366" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#64748b">Browsers / Mobile</text>

    <!-- Internet -->
    <rect x="256" y="316" width="118" height="70" rx="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="315" y="356" text-anchor="middle" font-size="13.5" font-weight="800" fill="#334155">Internet</text>

    <!-- Private Backend Boundary around Reverse Proxy + Backends -->
    <rect x="426" y="282" width="490" height="122" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="671" y="302" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3730a3">Datacenter / Cloud VPC (Protects &amp; Routes to Backend Servers)</text>

    <!-- Reverse Proxy -->
    <rect x="444" y="312" width="234" height="78" rx="12" fill="url(#rpGrad)"/>
    <text x="561" y="344" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Reverse Proxy</text>
    <text x="561" y="364" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#e0e7ff">Envoy / NGINX / Traefik / Caddy</text>
    <text x="561" y="380" text-anchor="middle" font-size="10.5" fill="#c7d2fe">TLS 1.3 Termination • L7 Routing</text>

    <!-- Backend Servers -->
    <rect x="752" y="314" width="146" height="74" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="825" y="345" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">App Microservices</text>
    <text x="825" y="366" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#4f46e5">10.0.1.x:8080</text>

    <line x1="196" y1="351" x2="248" y2="351" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#pxArrowPurple)"/>
    <line x1="374" y1="351" x2="436" y2="351" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#pxArrowPurple)"/>
    <line x1="678" y1="351" x2="744" y2="351" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#pxArrowPurple)"/>
  </g>
</svg>
