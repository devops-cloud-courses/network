<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="k8sGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cniGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="k8sArrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="k8sArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <filter id="k8sShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="980" height="450" rx="16" fill="#f8fafc"/>

  <!-- Top: Ingress / Gateway API -->
  <g filter="url(#k8sShadow)">
    <rect x="330" y="18" width="320" height="64" rx="14" fill="url(#k8sGrad)"/>
    <text x="490" y="45" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Ingress / Gateway API (L7 Load Balancer)</text>
    <text x="490" y="66" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#dbeafe">Routes external HTTPS → Service ClusterIP (10.96.0.10)</text>
  </g>

  <!-- Left Node: Worker Node 1 -->
  <rect x="28" y="106" width="430" height="236" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="243" y="132" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e40af">Worker Node 1 — Host IP: 192.168.10.11</text>

  <g filter="url(#k8sShadow)">
    <!-- Pod A -->
    <rect x="50" y="152" width="180" height="86" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="180" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Pod A (Frontend)</text>
    <text x="140" y="202" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#2563eb">Pod IP: 10.244.1.15</text>
    <text x="140" y="222" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#64748b">veth0 ↔ cbr0 / eBPF</text>

    <!-- Pod B -->
    <rect x="256" y="152" width="180" height="86" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="346" y="180" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Pod B (API)</text>
    <text x="346" y="202" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#2563eb">Pod IP: 10.244.1.16</text>
    <text x="346" y="222" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#64748b">veth1 ↔ cbr0 / eBPF</text>

    <!-- Node 1 CNI Agent -->
    <rect x="50" y="258" width="386" height="62" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="243" y="284" text-anchor="middle" font-size="13.5" font-weight="800" fill="#047857">CNI Dataplane (Cilium eBPF / Calico / kube-proxy)</text>
    <text x="243" y="305" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#475569">Pod CIDR: 10.244.1.0/24 • Virtual Service IP Translation</text>
  </g>

  <!-- Right Node: Worker Node 2 -->
  <rect x="522" y="106" width="430" height="236" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="737" y="132" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e40af">Worker Node 2 — Host IP: 192.168.10.12</text>

  <g filter="url(#k8sShadow)">
    <!-- Pod C -->
    <rect x="544" y="152" width="180" height="86" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="634" y="180" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Pod C (API Replica)</text>
    <text x="634" y="202" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#2563eb">Pod IP: 10.244.2.21</text>
    <text x="634" y="222" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#64748b">veth0 ↔ cbr0 / eBPF</text>

    <!-- Pod D -->
    <rect x="750" y="152" width="180" height="86" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="840" y="180" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Pod D (Redis/DB)</text>
    <text x="840" y="202" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#2563eb">Pod IP: 10.244.2.22</text>
    <text x="840" y="222" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#64748b">veth1 ↔ cbr0 / eBPF</text>

    <!-- Node 2 CNI Agent -->
    <rect x="544" y="258" width="386" height="62" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="737" y="284" text-anchor="middle" font-size="13.5" font-weight="800" fill="#047857">CNI Dataplane (Cilium eBPF / Calico / kube-proxy)</text>
    <text x="737" y="305" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#475569">Pod CIDR: 10.244.2.0/24 • NetworkPolicies Enforced</text>
  </g>

  <!-- Bottom: Overlay / Underlay Cross-Node Tunnel -->
  <g filter="url(#k8sShadow)">
    <rect x="130" y="366" width="720" height="62" rx="14" fill="url(#cniGrad)"/>
    <text x="490" y="394" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Cross-Node CNI Network (VXLAN / Geneve Overlay or BGP Native Routing)</text>
    <text x="490" y="414" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#d1fae5">Every Pod can talk directly to any Pod IP (10.244.x.x) across nodes without NAT</text>
  </g>

  <!-- Connectors -->
  <path d="M420 82 L346 146" stroke="#2563eb" stroke-width="2.5" marker-end="url(#k8sArrowBlue)"/>
  <path d="M560 82 L634 146" stroke="#2563eb" stroke-width="2.5" marker-end="url(#k8sArrowBlue)"/>
  <line x1="243" y1="320" x2="243" y2="360" stroke="#059669" stroke-width="3" marker-end="url(#k8sArrowGreen)"/>
  <line x1="737" y1="320" x2="737" y2="360" stroke="#059669" stroke-width="3" marker-end="url(#k8sArrowGreen)"/>
</svg>
