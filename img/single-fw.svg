<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="sfwGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="sfwShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="450" rx="16" fill="#f8fafc"/>

  <!-- Connection Links from Center Firewall -->
  <line x1="395" y1="220" x2="270" y2="145" stroke="#2563eb" stroke-width="3.5"/>
  <line x1="525" y1="220" x2="650" y2="145" stroke="#d97706" stroke-width="3.5"/>
  <line x1="460" y1="275" x2="460" y2="350" stroke="#64748b" stroke-width="3.5"/>

  <!-- Top-Left: Intranet (LAN) Zone -->
  <g filter="url(#sfwShadow)">
    <rect x="40" y="36" width="260" height="190" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="40" y="36" width="260" height="44" rx="18" fill="#eff6ff"/>
    <text x="170" y="64" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">Intranet (LAN)</text>

    <!-- Workstations -->
    <rect x="65" y="100" width="95" height="68" rx="10" fill="#f8fafc" stroke="#bfdbfe"/>
    <rect x="95" y="112" width="34" height="22" rx="3" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M90 138 H134" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <text x="112" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Client PC 1</text>

    <rect x="180" y="100" width="95" height="68" rx="10" fill="#f8fafc" stroke="#bfdbfe"/>
    <rect x="210" y="112" width="34" height="22" rx="3" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M205 138 H249" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <text x="227" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Client PC 2</text>

    <text x="170" y="204" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#2563eb">Private Trusted Zone</text>
  </g>

  <!-- Top-Right: DMZ Zone -->
  <g filter="url(#sfwShadow)">
    <rect x="620" y="36" width="260" height="190" rx="18" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
    <rect x="620" y="36" width="260" height="44" rx="18" fill="#fffbeb"/>
    <text x="750" y="64" text-anchor="middle" font-size="16" font-weight="800" fill="#b45309">DMZ (Demilitarized Zone)</text>

    <!-- WWW, SMTP, DNS Servers -->
    <rect x="638" y="100" width="68" height="72" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <rect x="656" y="112" width="32" height="26" rx="4" fill="#d97706"/>
    <text x="672" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">HTTP</text>
    <text x="672" y="158" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#92400e">WWW</text>

    <rect x="716" y="100" width="68" height="72" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <rect x="734" y="112" width="32" height="26" rx="4" fill="#d97706"/>
    <text x="750" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">MAIL</text>
    <text x="750" y="158" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#92400e">SMTP</text>

    <rect x="794" y="100" width="68" height="72" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <rect x="812" y="112" width="32" height="26" rx="4" fill="#d97706"/>
    <text x="828" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">:53</text>
    <text x="828" y="158" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#92400e">DNS</text>

    <text x="750" y="204" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#d97706">Public-Facing Services</text>
  </g>

  <!-- Center: Single 3-Legged Firewall -->
  <g filter="url(#sfwShadow)">
    <rect x="370" y="168" width="180" height="114" rx="18" fill="url(#sfwGrad)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="460" cy="212" r="22" fill="#ffffff"/>
    <path d="M460 196 L472 201 V211 C472 219 467 225 460 228 C453 225 448 219 448 211 V201 Z" fill="#dc2626"/>
    <text x="460" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Single Firewall</text>
    <text x="460" y="271" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#ffedd5">3 Network Interfaces</text>
  </g>

  <!-- Bottom: Router (WAN / Internet) -->
  <g filter="url(#sfwShadow)">
    <rect x="340" y="345" width="240" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="385" cy="384" r="22" fill="#0f172a"/>
    <path d="M375 384 H395 M385 374 V394" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="420" y="380" font-size="16" font-weight="800" fill="#0f172a">Router (WAN)</text>
    <text x="420" y="400" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">Internet Gateway</text>
  </g>
</svg>
