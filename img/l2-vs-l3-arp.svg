<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="l2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arpArrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arpArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <filter id="arpShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="980" height="430" rx="16" fill="#f8fafc"/>

  <!-- Left Box: Subnet A (L2 Domain) -->
  <rect x="22" y="22" width="440" height="386" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="242" y="50" text-anchor="middle" font-size="15" font-weight="800" fill="#1e40af">Subnet A (192.168.1.0/24) — Layer 2 Broadcast Domain</text>

  <!-- Host A1 -->
  <g filter="url(#arpShadow)">
    <rect x="44" y="76" width="180" height="84" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="134" y="103" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Host A1</text>
    <text x="134" y="125" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#2563eb">IP: 192.168.1.10</text>
    <text x="134" y="145" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#64748b">MAC: AA:BB:CC:01</text>

    <!-- Host A2 -->
    <rect x="260" y="76" width="180" height="84" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="350" y="103" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Host A2</text>
    <text x="350" y="125" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#2563eb">IP: 192.168.1.20</text>
    <text x="350" y="145" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#64748b">MAC: AA:BB:CC:02</text>

    <!-- L2 Switch -->
    <rect x="122" y="218" width="240" height="68" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="242" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">L2 Switch (MAC Table)</text>
    <text x="242" y="269" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#475569">Forwards Ethernet Frames by MAC</text>

    <!-- ARP Callout Card -->
    <rect x="44" y="314" width="396" height="74" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="58" y="328" width="52" height="22" rx="6" fill="#2563eb"/>
    <text x="84" y="343" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">ARP</text>
    <text x="120" y="343" font-size="12.5" font-weight="700" fill="#0f172a">Maps L3 IP → L2 MAC inside same subnet</text>
    <text x="58" y="369" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#1d4ed8">"Who has 192.168.1.20?" → "192.168.1.20 is at AA:BB:CC:02"</text>
  </g>

  <!-- Links in Subnet A -->
  <line x1="134" y1="160" x2="195" y2="216" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arpArrowBlue)"/>
  <line x1="289" y1="216" x2="350" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arpArrowBlue)"/>

  <!-- Center: L3 Router -->
  <g filter="url(#arpShadow)">
    <rect x="488" y="192" width="156" height="118" rx="18" fill="url(#l2Grad)" stroke="#ffffff" stroke-width="3"/>
    <text x="566" y="232" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">L3 Router</text>
    <text x="566" y="253" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#dbeafe">Default Gateway</text>
    <text x="566" y="274" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#e0e7ff">GW A: 192.168.1.1</text>
    <text x="566" y="291" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#a7f3d0">GW B: 10.0.2.1</text>
  </g>

  <line x1="362" y1="252" x2="482" y2="252" stroke="#2563eb" stroke-width="3" marker-end="url(#arpArrowBlue)"/>
  <line x1="644" y1="252" x2="718" y2="252" stroke="#059669" stroke-width="3" marker-end="url(#arpArrowGreen)"/>

  <!-- Right Box: Subnet B (Remote L3 Network) -->
  <rect x="674" y="22" width="284" height="386" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="816" y="50" text-anchor="middle" font-size="15" font-weight="800" fill="#065f46">Subnet B (10.0.2.0/24)</text>

  <g filter="url(#arpShadow)">
    <rect x="724" y="76" width="190" height="84" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="819" y="103" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Server B1</text>
    <text x="819" y="125" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#059669">IP: 10.0.2.50</text>
    <text x="819" y="145" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#64748b">MAC: DD:EE:FF:09</text>

    <rect x="724" y="218" width="190" height="68" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="819" y="248" text-anchor="middle" font-size="14" font-weight="800" fill="#047857">L2 Switch B</text>
    <text x="819" y="269" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#475569">Local L2 Delivery</text>

    <rect x="696" y="314" width="240" height="74" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="816" y="342" text-anchor="middle" font-size="12" font-weight="800" fill="#065f46">Across Subnets (L3 Routing):</text>
    <text x="816" y="362" text-anchor="middle" font-size="11" fill="#334155">Src/Dst IP stays end-to-end;</text>
    <text x="816" y="378" text-anchor="middle" font-size="11" fill="#334155">L2 MAC rewrites at every router hop</text>
  </g>

  <line x1="819" y1="218" x2="819" y2="164" stroke="#059669" stroke-width="2.5" marker-end="url(#arpArrowGreen)"/>
</svg>
