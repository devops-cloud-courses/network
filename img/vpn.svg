<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="vpnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="vpnShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="940" height="440" rx="16" fill="#f8fafc"/>

  <!-- Center Public Internet Cloud Backdrop -->
  <g filter="url(#vpnShadow)">
    <rect x="315" y="45" width="310" height="235" rx="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="470" y="84" text-anchor="middle" font-size="17" font-weight="800" fill="#334155">Public Internet / Shared Network</text>
    <text x="470" y="104" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">Encrypted IPSec / L2TP / MPLS Tunnels</text>
  </g>

  <!-- Encrypted Tunnel Tubes -->
  <path d="M250 110 C360 110, 480 155, 650 165" fill="none" stroke="#dbeafe" stroke-width="18" stroke-linecap="round"/>
  <path d="M250 110 C360 110, 480 155, 650 165" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-dasharray="8 6"/>

  <path d="M250 265 C360 265, 480 195, 650 185" fill="none" stroke="#dbeafe" stroke-width="18" stroke-linecap="round"/>
  <path d="M250 265 C360 265, 480 195, 650 185" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-dasharray="8 6"/>

  <path d="M470 330 C470 255, 555 215, 650 205" fill="none" stroke="#e0e7ff" stroke-width="16" stroke-linecap="round"/>
  <path d="M470 330 C470 255, 555 215, 650 205" fill="none" stroke="#4f46e5" stroke-width="3.5" stroke-dasharray="8 6"/>

  <!-- Lock Badge in Center of Tunnels -->
  <g filter="url(#vpnShadow)">
    <rect x="405" y="152" width="130" height="44" rx="22" fill="#0f172a"/>
    <circle cx="430" cy="174" r="13" fill="#059669"/>
    <rect x="425" y="173" width="10" height="8" rx="1.5" fill="#ffffff"/>
    <path d="M427 173 V170 C427 168 433 168 433 170 V173" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <text x="482" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">VPN Tunnel</text>
  </g>

  <!-- Left Top: Regional Office 1 -->
  <g filter="url(#vpnShadow)">
    <rect x="36" y="52" width="224" height="116" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="54" y="72" width="44" height="44" rx="10" fill="#eff6ff"/>
    <text x="76" y="99" text-anchor="middle" font-size="13" font-weight="800" fill="#2563eb">GW</text>
    <text x="112" y="92" font-size="16" font-weight="800" fill="#0f172a">Regional Office</text>
    <text x="112" y="112" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">Site-to-Site VPN</text>
    <text x="112" y="144" font-size="11" font-family="'JetBrains Mono', monospace" fill="#2563eb">LAN: 10.10.0.0/16</text>
  </g>

  <!-- Left Bottom: Regional Office 2 -->
  <g filter="url(#vpnShadow)">
    <rect x="36" y="206" width="224" height="116" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="54" y="226" width="44" height="44" rx="10" fill="#eff6ff"/>
    <text x="76" y="253" text-anchor="middle" font-size="13" font-weight="800" fill="#2563eb">GW</text>
    <text x="112" y="246" font-size="16" font-weight="800" fill="#0f172a">Regional Office</text>
    <text x="112" y="266" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">Site-to-Site VPN</text>
    <text x="112" y="298" font-size="11" font-family="'JetBrains Mono', monospace" fill="#2563eb">LAN: 10.20.0.0/16</text>
  </g>

  <!-- Bottom Center: Remote / Roaming Users -->
  <g filter="url(#vpnShadow)">
    <rect x="325" y="320" width="290" height="96" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="345" y="344" width="48" height="48" rx="12" fill="#eef2ff"/>
    <rect x="356" y="356" width="26" height="16" rx="2" fill="none" stroke="#4f46e5" stroke-width="2"/>
    <path d="M352 376 H386" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <text x="408" y="364" font-size="16" font-weight="800" fill="#0f172a">Remote / Roaming Users</text>
    <text x="408" y="386" font-size="12" font-family="'JetBrains Mono', monospace" fill="#4f46e5">Client-to-Site VPN (L2 / L3)</text>
  </g>

  <!-- Right: Head Office / Cloud Private Network -->
  <g filter="url(#vpnShadow)">
    <rect x="650" y="78" width="254" height="214" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="650" y="78" width="254" height="50" rx="20" fill="url(#vpnGrad)"/>
    <text x="777" y="109" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">Head-Office / Core</text>

    <rect x="676" y="148" width="202" height="54" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="777" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">VPN Concentrator / Gateway</text>
    <text x="777" y="191" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#3b82f6">Terminates Encrypted Tunnels</text>

    <rect x="676" y="216" width="202" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="777" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Internal Private Resources</text>
    <text x="777" y="259" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#059669">10.0.0.0/16</text>
  </g>
</svg>
