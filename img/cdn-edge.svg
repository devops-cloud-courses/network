<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="cdnEdgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cdnOriginGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="cdnArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="cdnArrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <filter id="cdnShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="16" fill="#f8fafc"/>

  <!-- Left: Global End Users -->
  <g filter="url(#cdnShadow)">
    <rect x="26" y="42" width="174" height="94" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="113" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Users (Europe)</text>
    <text x="113" y="98" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#2563eb">Paris / Frankfurt</text>
    <text x="113" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">RTT ~ 8 ms</text>

    <rect x="26" y="173" width="174" height="94" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="113" y="207" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Users (US East)</text>
    <text x="113" y="229" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#2563eb">New York / Virginia</text>
    <text x="113" y="249" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">RTT ~ 10 ms</text>

    <rect x="26" y="304" width="174" height="94" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="113" y="338" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Users (APAC)</text>
    <text x="113" y="360" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#2563eb">Tokyo / Singapore</text>
    <text x="113" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">RTT ~ 12 ms</text>
  </g>

  <!-- Center: Anycast CDN Edge Network -->
  <rect x="292" y="20" width="320" height="400" rx="20" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="452" y="48" text-anchor="middle" font-size="15" font-weight="800" fill="#065f46">CDN Edge PoPs (Anycast IP)</text>

  <g filter="url(#cdnShadow)">
    <rect x="322" y="66" width="260" height="82" rx="14" fill="url(#cdnEdgeGrad)"/>
    <text x="452" y="98" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">EU Edge PoP Cache</text>
    <text x="452" y="120" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#d1fae5">95% Cache HIT → Instant Reply</text>
    <text x="452" y="137" text-anchor="middle" font-size="10.5" fill="#a7f3d0">TLS Termination + DDoS Shield</text>

    <rect x="322" y="180" width="260" height="82" rx="14" fill="url(#cdnEdgeGrad)"/>
    <text x="452" y="212" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">US Edge PoP Cache</text>
    <text x="452" y="234" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#d1fae5">95% Cache HIT → Instant Reply</text>
    <text x="452" y="251" text-anchor="middle" font-size="10.5" fill="#a7f3d0">Static Assets, Video, API Cache</text>

    <rect x="322" y="294" width="260" height="82" rx="14" fill="url(#cdnEdgeGrad)"/>
    <text x="452" y="326" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">APAC Edge PoP Cache</text>
    <text x="452" y="348" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#d1fae5">95% Cache HIT → Instant Reply</text>
    <text x="452" y="365" text-anchor="middle" font-size="10.5" fill="#a7f3d0">HTTP/3 QUIC + Brotli Compression</text>
  </g>

  <!-- Arrows Users <-> Edge PoPs -->
  <line x1="200" y1="89" x2="314" y2="99" stroke="#059669" stroke-width="3" marker-end="url(#cdnArrowGreen)"/>
  <line x1="200" y1="220" x2="314" y2="220" stroke="#059669" stroke-width="3" marker-end="url(#cdnArrowGreen)"/>
  <line x1="200" y1="351" x2="314" y2="341" stroke="#059669" stroke-width="3" marker-end="url(#cdnArrowGreen)"/>

  <!-- Right: Cloud Origin -->
  <g filter="url(#cdnShadow)">
    <rect x="708" y="132" width="224" height="176" rx="18" fill="url(#cdnOriginGrad)" stroke="#ffffff" stroke-width="3"/>
    <text x="820" y="178" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Origin Infrastructure</text>
    <text x="820" y="202" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#dbeafe">Cloud VPC / Object Storage</text>
    <rect x="730" y="220" width="180" height="64" rx="10" fill="#ffffff"/>
    <text x="820" y="246" text-anchor="middle" font-size="12" font-weight="800" fill="#1e40af">Only ~5% Cache MISS</text>
    <text x="820" y="266" text-anchor="middle" font-size="11" fill="#475569">Dynamic / Uncached Fetch</text>
  </g>

  <!-- Cache Miss Dashed Arrows -->
  <path d="M582 107 L702 185" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#cdnArrowAmber)"/>
  <path d="M582 220 L700 220" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#cdnArrowAmber)"/>
  <path d="M582 335 L702 255" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#cdnArrowAmber)"/>
  <text x="648" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Cache MISS</text>
</svg>
